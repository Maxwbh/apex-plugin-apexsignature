- # ====== Process: SAVE =======================================
  id: 80124041785141650
  identification: 
    name: SAVE
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      DECLARE
        l_clob CLOB;
        l_blob BLOB;
        l_offset INTEGER := 1;
        l_buffer_size INTEGER := 32000;
        l_buffer_varchar VARCHAR2(32000);
        l_buffer_raw RAW(32767);
      BEGIN
        SELECT clob001 INTO l_clob FROM apex_collections WHERE collection_name = 'CLOB_CONTENT';
      
        DBMS_LOB.CREATETEMPORARY(l_blob, TRUE);
        WHILE l_offset <= DBMS_LOB.getlength(l_clob) LOOP
          l_buffer_size := LEAST(32000, DBMS_LOB.getlength(l_clob) - l_offset + 1);
          DBMS_LOB.read(l_clob, l_buffer_size, l_offset, l_buffer_varchar);
          l_buffer_raw := UTL_ENCODE.base64_decode(UTL_RAW.cast_to_raw(l_buffer_varchar));
          DBMS_LOB.writeappend(l_blob, UTL_RAW.length(l_buffer_raw), l_buffer_raw);
          l_offset := l_offset + l_buffer_size;
        END LOOP;
      
        INSERT INTO SIGNED_PDFS (file_name, file_content)
        VALUES (:P1_SIGNED_FILENAME, l_blob);
      
        COMMIT;
      END;
      

  execution: 
    sequence: 30
    point: Ajax Callback
    run-process: Once Per Session or When Reset

  security: 
    authorization-scheme: Must Not Be Public User

