- # ====== Process: SAVE_SIGNED_PDF_3 ==========================
  id: 80123225438141650
  identification: 
    name: SAVE_SIGNED_PDF_3
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      DECLARE
        v_blob           BLOB;
        v_offset         INTEGER := 1;
        v_chunk_size     INTEGER := 32000;
        v_total_length   INTEGER;
        v_buffer_varchar VARCHAR2(32000);
        v_buffer_raw     RAW(32767);
        p_clob           CLOB := apex_application.g_x02;
      BEGIN
        IF p_clob IS NULL THEN
          raise_application_error(-20001, 'CLOB is empty.');
        END IF;
      
        DBMS_LOB.createtemporary(v_blob, TRUE);
        v_total_length := DBMS_LOB.getlength(p_clob);
      
        WHILE v_offset <= v_total_length LOOP
          v_buffer_varchar := DBMS_LOB.SUBSTR(p_clob, v_chunk_size, v_offset);
          v_buffer_raw := UTL_ENCODE.base64_decode(UTL_RAW.cast_to_raw(v_buffer_varchar));
          DBMS_LOB.writeappend(v_blob, UTL_RAW.length(v_buffer_raw), v_buffer_raw);
          v_offset := v_offset + v_chunk_size;
        END LOOP;
      
        INSERT INTO SIGNED_PDFS (
          FILE_NAME,
          FILE_CONTENT
        ) VALUES (
          apex_application.g_x01,
          v_blob
        );
      
        COMMIT;
      EXCEPTION
        WHEN OTHERS THEN
          APEX_DEBUG.ENABLE(9);
          APEX_DEBUG.MESSAGE('PL/SQL ERROR: ' || SQLERRM);
          raise_application_error(-20001, 'PL/SQL Failed: ' || SQLERRM);
      END;
      

