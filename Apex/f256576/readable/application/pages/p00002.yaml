- # ====== Process: SAVE_SIGNED_PDF_2 ==========================
  id: 80122450201141650
  identification: 
    name: SAVE_SIGNED_PDF_2
    type: Execute Code
    execution-chain: None

  source: 
    location: Local Database
    language: PL/SQL
    pl/sql-code: |
      DECLARE
        v_blob           BLOB;
        v_offset         INTEGER := 1;
        v_buffer_varchar VARCHAR2(32000);
        v_buffer_raw     RAW(32767);
        v_buffer_size    INTEGER := 32000; -- changed from CONSTANT
        v_total_length   INTEGER;
        p_clob           CLOB := :P1_SIGNED_BLOB;
      BEGIN
        IF p_clob IS NULL THEN
          RETURN;
        END IF;
      
        DBMS_LOB.createtemporary(v_blob, TRUE);
        v_total_length := DBMS_LOB.getlength(p_clob);
      
        WHILE v_offset <= v_total_length LOOP
          v_buffer_size := 32000; -- re-initialize each time to full block
          DBMS_LOB.read(p_clob, v_buffer_size, v_offset, v_buffer_varchar);
          v_buffer_raw := UTL_ENCODE.base64_decode(UTL_RAW.cast_to_raw(v_buffer_varchar));
          DBMS_LOB.writeappend(v_blob, UTL_RAW.length(v_buffer_raw), v_buffer_raw);
          v_offset := v_offset + v_buffer_size;
        END LOOP;
      
        INSERT INTO SIGNED_PDFS (
          FILE_NAME,
          FILE_CONTENT
        ) VALUES (
          apex_application.g_x01,
          v_blob
        );
      
        COMMIT;
      END;
      

