  actions: 
  - # ====== Action: Execute JavaScript Code =====================
    id: 80124981774141652
    identification: 
      action: Execute JavaScript Code

    settings: 
      code: |
        document.getElementById("save-pdf").addEventListener("click", async () => {
          if (!window.uploadedPdfBuffer) {
            alert("Upload a PDF first.");
            return;
          }
        
          const pdfDoc = await PDFLib.PDFDocument.load(window.uploadedPdfBuffer);
          const page = pdfDoc.getPages()[0];
        
          const sigImg = document.getElementById("signature-preview");
          if (!sigImg.src) {
            alert("Please preview/upload signature first.");
            return;
          }
        
          const sigCanvas = document.createElement("canvas");
          sigCanvas.width = sigImg.naturalWidth;
          sigCanvas.height = sigImg.naturalHeight;
          const sigCtx = sigCanvas.getContext("2d");
          sigCtx.drawImage(sigImg, 0, 0);
          const pngImage = await pdfDoc.embedPng(sigCanvas.toDataURL());
        
          const x = parseInt(signatureImg.style.left);
          const y = canvas.height - parseInt(signatureImg.style.top) - signatureImg.height;
        
          page.drawImage(pngImage, {
            x,
            y,
            width: 120,
            height: 50,
          });
        
          const signedPdfBytes = await pdfDoc.save();
          const blob = new Blob([signedPdfBytes], { type: "application/pdf" });
        
          const reader = new FileReader();
          reader.onload = function () {
            // ✅ base64 is correctly available here
            const base64 = reader.result.split(",")[1];
        
            // Optional: Set to APEX items (if required in APEX UI)
            if (apex.item("P1_SIGNED_FILENAME")) {
              apex.item("P1_SIGNED_FILENAME").setValue("signed_document.pdf");
            }
            if (apex.item("P1_SIGNED_BLOB")) {
              apex.item("P1_SIGNED_BLOB").setValue(base64);
            }
        
            // ✅ Correct AJAX Call
            apex.server.process("SAVE_SIGNED_PDF", {
              x01: "signed_document.pdf",
              x02: base64
            }, {
              success: function () {
                alert("✅ PDF saved to database.");
