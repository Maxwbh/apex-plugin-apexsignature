      <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.0.1/docx.umd.min.js"></script>
      
      <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.worker.min.js';
      
        let canvas = document.getElementById("pdf-canvas"),
            ctx = canvas.getContext("2d"),
            pdfDoc = null,
            pageNum = 1,
            uploadedPdfBuffer = null,
            lastSignedBlob = null,
            scale = 1.5,
            pdfViewport = null,
            signatureRelativePosition = { x: 0.05, y: 0.05 },
            originalPdfFileName = "signed_document.pdf",
            currentSignatureColor = "#000000",
            currentBackgroundColor = "#ffffff",
            isBackgroundVisible = true,
            signatureThickness = 2;
      
        // Signature state management
        const signatureState = {
          width: 120,
          height: 50,
          color: "#000000",
          thickness: 2,
          isImage: false
        };
      
        // Initialize UI controls
        document.getElementById('signature-thickness').addEventListener('input', function() {
          signatureThickness = parseInt(this.value);
          document.getElementById('thickness-value').textContent = `${signatureThickness}px`;
          updateSignaturePadStyle();
        });
      
        document.getElementById('signature-color').addEventListener('input', function() {
          currentSignatureColor = this.value;
          updateSignaturePadStyle();
          applyColorToSignature();
        });
      
        document.getElementById('background-color').addEventListener('input', function() {
          currentBackgroundColor = this.value;
          if (isBackgroundVisible) {
            document.getElementById('pdf-container').style.backgroundColor = currentBackgroundColor;
          }
        });
      
        document.getElementById('show-background').addEventListener('change', function() {
          isBackgroundVisible = this.checked;
          document.getElementById('pdf-container').style.backgroundColor = isBackgroundVisible ? currentBackgroundColor : 'transparent';
        });
      
        function updateSignaturePadStyle() {
          const sigCtx = sigPad.getContext('2d');
          sigCtx.strokeStyle = currentSignatureColor;
          sigCtx.lineWidth = signatureThickness;
          sigCtx.lineJoin = 'round';
          sigCtx.lineCap = 'round';
        }
      
        function applyColorToSignature() {
          const signatureImg = document.getElementById('draggable-signature');
          if (!signatureImg.src || signatureState.isImage) return;
          
          // For non-image signatures (canvas-based), we can directly apply the color
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = signatureImg.width;
          tempCanvas.height = signatureImg.height;
          const tempCtx = tempCanvas.getContext('2d');
          tempCtx.drawImage(signatureImg, 0, 0);
          
          // Apply color overlay while preserving transparency
          tempCtx.globalCompositeOperation = 'source-atop';
          tempCtx.fillStyle = currentSignatureColor;
          tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
          
          signatureImg.src = tempCanvas.toDataURL();
        }
      
        function renderPDF(fileBuffer) {
          pdfjsLib.getDocument({ data: fileBuffer }).promise.then(pdf => {
            pdfDoc = pdf;
            return pdf.getPage(pageNum);
          }).then(page => {
            pdfViewport = page.getViewport({ scale });
            canvas.width = pdfViewport.width;
            canvas.height = pdfViewport.height;
            
            // Clear with background color if enabled
            if (isBackgroundVisible) {
              ctx.fillStyle = currentBackgroundColor;
              ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            page.render({ canvasContext: ctx, viewport: pdfViewport });
          });
        }
      
        const sigPad = document.getElementById("signature-pad");
        const sigCtx = sigPad.getContext("2d");
        let drawing = false;
      
        // Initialize signature pad with default styles
        updateSignaturePadStyle();
      
        sigPad.addEventListener("mousedown", e => {
          drawing = true;
          sigCtx.beginPath();
          sigCtx.moveTo(e.offsetX, e.offsetY);
          sigCtx.strokeStyle = currentSignatureColor;
          sigCtx.lineWidth = signatureThickness;
        });
      
        sigPad.addEventListener("mousemove", e => {
          if (drawing) {
            sigCtx.lineTo(e.offsetX, e.offsetY);
            sigCtx.stroke();
          }
        });
      
        sigPad.addEventListener("mouseup", () => drawing = false);
        sigPad.addEventListener("mouseleave", () => drawing = false);
      
        // Touch support for signature pad
        sigPad.addEventListener("touchstart", e => {
          e.preventDefault();
          const touch = e.touches[0];
          const mouseEvent = new MouseEvent("mousedown", {
            clientX: touch.clientX,
            clientY: touch.clientY
          });
          sigPad.dispatchEvent(mouseEvent);
        });
      
        sigPad.addEventListener("touchmove", e => {
          e.preventDefault();
          const touch = e.touches[0];
          const mouseEvent = new MouseEvent("mousemove", {
            clientX: touch.clientX,
            clientY: touch.clientY
          });
          sigPad.dispatchEvent(mouseEvent);
        });
      
        sigPad.addEventListener("touchend", e => {
          e.preventDefault();
          const mouseEvent = new MouseEvent("mouseup");
          sigPad.dispatchEvent(mouseEvent);
        });
      
        document.getElementById("clear-signature").addEventListener("click", () => {
          sigCtx.clearRect(0, 0, sigPad.width, sigPad.height);
        });
      
        document.getElementById("prev-btn").addEventListener("click", () => {
          document.getElementById("signature-preview").src = sigPad.toDataURL();
          signatureState.isImage = false;
        });
      
        document.getElementById("upload-signature").addEventListener("change", function () {
          const reader = new FileReader();
          reader.onload = e => {
            document.getElementById("signature-preview").src = e.target.result;
            signatureState.isImage = true;
          };
          reader.readAsDataURL(this.files[0]);
        });
      
        document.getElementById("save-sign").addEventListener("click", () => {
          alert("Signature saved. Now enable PDF preview and click 'Use This Sign'.");
        });
      
        document.getElementById("toggle-preview").addEventListener("change", function () {
          const show = this.checked;
          document.getElementById("pdf-container").style.display = show ? "block" : "none";
          document.getElementById("use-sign").style.display = show ? "inline-block" : "none";
          document.getElementById("upload-label").style.display = show ? "block" : "none";
          document.getElementById("upload-pdf").style.display = show ? "block" : "none";
        });
      
        document.getElementById("upload-pdf").addEventListener("change", function () {
          const file = this.files[0];
          if (!file || file.type !== "application/pdf") return alert("Please upload a PDF file.");
          const reader = new FileReader();
          reader.onload = function (e) {
            uploadedPdfBuffer = e.target.result;
            renderPDF(uploadedPdfBuffer);
      
            const uploadedFileName = file.name;
            const dotIndex = uploadedFileName.lastIndexOf(".");
            if (dotIndex > 0) {
              const base = uploadedFileName.substring(0, dotIndex);
              const ext = uploadedFileName.substring(dotIndex);
              originalPdfFileName = `${base}_signed${ext}`;
            } else {
              originalPdfFileName = `${uploadedFileName}_signed.pdf`;
            }
          };
          reader.readAsArrayBuffer(file);
        });
      
        document.getElementById("use-sign").addEventListener("click", () => {
          const sig = document.getElementById("draggable-signature");
          const preview = document.getElementById("signature-preview");
          if (!preview.src) return alert("No signature to use. Draw or upload first.");
          
          sig.src = preview.src;
          sig.style.display = "block";
          sig.style.width = `${signatureState.width}px`;
          sig.style.height = `${signatureState.height}px`;
          sig.style.left = `${canvas.offsetLeft + canvas.width * signatureRelativePosition.x}px`;
          sig.style.top = `${canvas.offsetTop + canvas.height * signatureRelativePosition.y}px`;
          
          // Update signature state
          signatureState.isImage = document.getElementById("upload-signature").files.length > 0;
          
          // Apply color if not an image
          if (!signatureState.isImage) {
            applyColorToSignature();
          }
        });
      
        // Enhanced drag and resize functionality
        const signatureImg = document.getElementById("draggable-signature");
        let offsetX, offsetY, isDragging = false;
        let isResizing = false;
        let resizeHandle = null;
        let startWidth, startHeight, startX, startY;
      
        // Mouse event handlers for dragging
        signatureImg.addEventListener("mousedown", e => {
          if (e.target === signatureImg) {
            isDragging = true;
            offsetX = e.offsetX;
            offsetY = e.offsetY;
            e.preventDefault(); // Prevent text selection
          }
        });
      
        // Touch event handlers for dragging
        signatureImg.addEventListener("touchstart", e => {
          if (e.target === signatureImg) {
            const touch = e.touches[0];
            const rect = signatureImg.getBoundingClientRect();
            offsetX = touch.clientX - rect.left;
            offsetY = touch.clientY - rect.top;
            isDragging = true;
            e.preventDefault();
          }
        });
      
        // Resize handle event handlers
        document.querySelectorAll('.resize-handle').forEach(handle => {
          // Mouse events
          handle.addEventListener('mousedown', function(e) {
            isResizing = true;
            resizeHandle = this;
            startWidth = parseInt(signatureImg.width);
            startHeight = parseInt(signatureImg.height);
            startX = e.clientX;
            startY = e.clientY;
            e.preventDefault();
            e.stopPropagation();
          });
      
          // Touch events
          handle.addEventListener('touchstart', function(e) {
            isResizing = true;
            resizeHandle = this;
            startWidth = parseInt(signatureImg.width);
            startHeight = parseInt(signatureImg.height);
            const touch = e.touches[0];
            startX = touch.clientX;
            startY = touch.clientY;
            e.preventDefault();
            e.stopPropagation();
          });
        });
      
        // Document mouse move handler for both dragging and resizing
        document.addEventListener("mousemove", e => {
          const rect = canvas.getBoundingClientRect();
          
          if (isDragging) {
            const newX = e.clientX - rect.left - offsetX;
            const newY = e.clientY - rect.top - offsetY;
            const left = Math.max(0, Math.min(newX, canvas.width - signatureImg.width));
            const top = Math.max(0, Math.min(newY, canvas.height - signatureImg.height));
            
            signatureImg.style.left = `${left}px`;
            signatureImg.style.top = `${top}px`;
            signatureRelativePosition.x = left / canvas.width;
            signatureRelativePosition.y = top / canvas.height;
          } else if (isResizing && resizeHandle) {
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            
            let newWidth = startWidth;
            let newHeight = startHeight;
            
            // Calculate new dimensions based on which handle is being used
            if (resizeHandle.classList.contains('resize-handle-bottom-right')) {
              newWidth = Math.max(30, startWidth + deltaX);
              newHeight = Math.max(20, startHeight + deltaY);
            } else if (resizeHandle.classList.contains('resize-handle-bottom-left')) {
              newWidth = Math.max(30, startWidth - deltaX);
              newHeight = Math.max(20, startHeight + deltaY);
              if (newWidth !== startWidth) {
                const left = parseInt(signatureImg.style.left) + (startWidth - newWidth);
                signatureImg.style.left = `${left}px`;
              }
            } else if (resizeHandle.classList.contains('resize-handle-top-right')) {
              newWidth = Math.max(30, startWidth + deltaX);
              newHeight = Math.max(20, startHeight - deltaY);
              if (newHeight !== startHeight) {
                const top = parseInt(signatureImg.style.top) + (startHeight - newHeight);
                signatureImg.style.top = `${top}px`;
              }
            } else if (resizeHandle.classList.contains('resize-handle-top-left')) {
              newWidth = Math.max(30, startWidth - deltaX);
              newHeight = Math.max(20, startHeight - deltaY);
              if (newWidth !== startWidth) {
                const left = parseInt(signatureImg.style.left) + (startWidth - newWidth);
                signatureImg.style.left = `${left}px`;
              }
              if (newHeight !== startHeight) {
                const top = parseInt(signatureImg.style.top) + (startHeight - newHeight);
                signatureImg.style.top = `${top}px`;
              }
            }
            
            // Maintain aspect ratio if shift key is pressed
            if (e.shiftKey) {
              const aspectRatio = startWidth / startHeight;
              if (resizeHandle.classList.contains('resize-handle-bottom-right') || 
                  resizeHandle.classList.contains('resize-handle-top-left')) {
                newHeight = newWidth / aspectRatio;
              } else {
                newWidth = newHeight * aspectRatio;
              }
            }
            
            signatureImg.style.width = `${newWidth}px`;
            signatureImg.style.height = `${newHeight}px`;
            
            // Update signature state
            signatureState.width = newWidth;
            signatureState.height = newHeight;
          }
        });
      
        // Document touch move handler for both dragging and resizing
        document.addEventListener("touchmove", e => {
          if (!(isDragging || isResizing)) return;
          
          const touch = e.touches[0];
          const rect = canvas.getBoundingClientRect();
          
          if (isDragging) {
            const newX = touch.clientX - rect.left - offsetX;
            const newY = touch.clientY - rect.top - offsetY;
            const left = Math.max(0, Math.min(newX, canvas.width - signatureImg.width));
            const top = Math.max(0, Math.min(newY, canvas.height - signatureImg.height));
            
            signatureImg.style.left = `${left}px`;
            signatureImg.style.top = `${top}px`;
            signatureRelativePosition.x = left / canvas.width;
            signatureRelativePosition.y = top / canvas.height;
          } else if (isResizing && resizeHandle) {
            const deltaX = touch.clientX - startX;
            const deltaY = touch.clientY - startY;
            
            let newWidth = startWidth;
            let newHeight = startHeight;
            
            if (resizeHandle.classList.contains('resize-handle-bottom-right')) {
              newWidth = Math.max(30, startWidth + deltaX);
              newHeight = Math.max(20, startHeight + deltaY);
            } else if (resizeHandle.classList.contains('resize-handle-bottom-left')) {
              newWidth = Math.max(30, startWidth - deltaX);
              newHeight = Math.max(20, startHeight + deltaY);
              if (newWidth !== startWidth) {
                const left = parseInt(signatureImg.style.left) + (startWidth - newWidth);
                signatureImg.style.left = `${left}px`;
              }
            } else if (resizeHandle.classList.contains('resize-handle-top-right')) {
              newWidth = Math.max(30, startWidth + deltaX);
              newHeight = Math.max(20, startHeight - deltaY);
              if (newHeight !== startHeight) {
                const top = parseInt(signatureImg.style.top) + (startHeight - newHeight);
                signatureImg.style.top = `${top}px`;
              }
            } else if (resizeHandle.classList.contains('resize-handle-top-left')) {
              newWidth = Math.max(30, startWidth - deltaX);
              newHeight = Math.max(20, startHeight - deltaY);
              if (newWidth !== startWidth) {
                const left = parseInt(signatureImg.style.left) + (startWidth - newWidth);
                signatureImg.style.left = `${left}px`;
              }
              if (newHeight !== startHeight) {
                const top = parseInt(signatureImg.style.top) + (startHeight - newHeight);
                signatureImg.style.top = `${top}px`;
              }
            }
            
            signatureImg.style.width = `${newWidth}px`;
            signatureImg.style.height = `${newHeight}px`;
            
            // Update signature state
            signatureState.width = newWidth;
            signatureState.height = newHeight;
          }
        });
      
        // End interactions
        document.addEventListener("mouseup", () => {
          isDragging = false;
          isResizing = false;
          resizeHandle = null;
        });
      
        document.addEventListener("touchend", () => {
          isDragging = false;
          isResizing = false;
          resizeHandle = null;
        });
      
        // Save functionality with all enhancements
        document.getElementById("save-pdf").addEventListener("click", async () => {
          const format = document.getElementById("save-format")?.value || "pdf";
      
          if (format === "jpeg" || format === "png" || format === "docx") {
            const sig = document.getElementById("draggable-signature");
            if (!sig.src || sig.style.display === "none") {
              alert("❗ Please apply and position your signature before saving.");
              return;
            }
      
            // Prepare temporary canvas
            const tempCanvas = document.createElement("canvas");
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext("2d");
      
            // Draw background if enabled
            if (isBackgroundVisible) {
              tempCtx.fillStyle = currentBackgroundColor;
              tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            }
            
            // Draw PDF canvas and signature
            tempCtx.drawImage(canvas, 0, 0);
            const left = parseFloat(sig.style.left);
            const top = parseFloat(sig.style.top);
            tempCtx.drawImage(sig, left, top, sig.width, sig.height);
      
            let mimeType = "image/jpeg";
            let ext = "jpg";
            if (format === "png") {
              mimeType = "image/png";
              ext = "png";
            } else if (format === "docx") {
              mimeType = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
              ext = "docx";
            }
      
            const dataUrl = format === "docx"
              ? tempCanvas.toDataURL("image/png") // use PNG for DOCX embed
              : tempCanvas.toDataURL(mimeType);
      
            const base64 = dataUrl.split(",")[1];
            const fileName = originalPdfFileName.replace(/\.pdf$/, `_signed.${ext}`);
      
            if (apex.item("P1_SIGNED_FILENAME")) apex.item("P1_SIGNED_FILENAME").setValue(fileName);
            if (apex.item("P1_SIGNED_BLOB")) apex.item("P1_SIGNED_BLOB").setValue(base64);
      
            apex.server.process("SAVE_SIGNED_PDF", {
              x01: fileName,
              pageItems: "#P1_SIGNED_BLOB"
            }, {
              success: () => alert(`✅ ${ext.toUpperCase()} saved to APEX.`),
              error: err => {
                console.error(err);
                alert(`❌ ${ext.toUpperCase()} save failed.`);
              }
            });
      
          } else {
            await generateSignedPDF(); // PDF logic
          }
        });
      
        async function generateSignedPDF() {
          if (!uploadedPdfBuffer || !pdfViewport) return alert("PDF not loaded.");
      
          const pdfDocLib = await PDFLib.PDFDocument.load(uploadedPdfBuffer);
          const page = pdfDocLib.getPages()[0];
          const { width: pdfWidth, height: pdfHeight } = page.getSize();
      
          const sigImg = document.getElementById("signature-preview");
          const sigCanvas = document.createElement("canvas");
          sigCanvas.width = sigImg.naturalWidth || signatureState.width;
          sigCanvas.height = sigImg.naturalHeight || signatureState.height;
          const sigCtx = sigCanvas.getContext("2d");
          
          // Draw the signature with the correct color
          if (signatureState.isImage) {
            sigCtx.drawImage(sigImg, 0, 0, sigCanvas.width, sigCanvas.height);
            
            // Apply color overlay for image signatures if color is not black
            if (currentSignatureColor !== "#000000") {
              sigCtx.globalCompositeOperation = "source-atop";
              sigCtx.fillStyle = currentSignatureColor;
              sigCtx.fillRect(0, 0, sigCanvas.width, sigCanvas.height);
            }
          } else {
            // For drawn signatures, just redraw with current color
            sigCtx.drawImage(sigImg, 0, 0, sigCanvas.width, sigCanvas.height);
          }
      
          const pngImage = await pdfDocLib.embedPng(sigCanvas.toDataURL());
      
          const canvasToPdfScaleX = pdfWidth / canvas.width;
          const canvasToPdfScaleY = pdfHeight / canvas.height;
          const offsetX = 10 * canvasToPdfScaleX;
          const offsetY = 20 * canvasToPdfScaleY;
      
          const x = signatureRelativePosition.x * pdfWidth + offsetX + 30;
          const y = pdfHeight - (signatureRelativePosition.y * pdfHeight) - 100 + offsetY;
      
          page.drawImage(pngImage, {
            x: x,
            y: y,
            width: signatureState.width * canvasToPdfScaleX,
            height: signatureState.height * canvasToPdfScaleY,
          });
      
          const pdfBytes = await pdfDocLib.save();
          const blob = new Blob([pdfBytes], { type: "application/pdf" });
          lastSignedBlob = blob;
      
          const reader = new FileReader();
          reader.onloadend = function () {
            const arrayBuffer = reader.result;
            const uint8Array = new Uint8Array(arrayBuffer);
            let binary = '';
            for (let i = 0; i < uint8Array.byteLength; i++) {
              binary += String.fromCharCode(uint8Array[i]);
            }
            const base64 = btoa(binary);
      
            if (apex.item("P1_SIGNED_FILENAME")) apex.item("P1_SIGNED_FILENAME").setValue(originalPdfFileName);
            if (apex.item("P1_SIGNED_BLOB")) apex.item("P1_SIGNED_BLOB").setValue(base64);
      
            apex.server.process("SAVE_SIGNED_PDF", {
              x01: originalPdfFileName,
              pageItems: "#P1_SIGNED_BLOB"
            }, {
              success: () => alert("✅ PDF saved to APEX."),
              error: err => {
                console.error(err);
                alert("❌ PDF save failed.");
              }
            });
          };
          reader.readAsArrayBuffer(blob);
        }
      
        document.getElementById("download-pdf").addEventListener("click", async () => {
          const format = document.getElementById("save-format")?.value || "pdf";
      
          if (format === "jpeg" || format === "png" || format === "docx") {
            const sig = document.getElementById("draggable-signature");
            if (!sig.src || sig.style.display === "none") {
              alert("❗ Please apply and position your signature before downloading.");
              return;
            }
      
            const tempCanvas = document.createElement("canvas");
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext("2d");
            
            // Draw background if enabled
            if (isBackgroundVisible) {
              tempCtx.fillStyle = currentBackgroundColor;
              tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            }
            
            tempCtx.drawImage(canvas, 0, 0);
            const left = parseFloat(sig.style.left);
            const top = parseFloat(sig.style.top);
            tempCtx.drawImage(sig, left, top, sig.width, sig.height);
      
            let mimeType = "image/jpeg";
            let ext = "jpg";
            if (format === "png") {
              mimeType = "image/png";
              ext = "png";
            } else if (format === "docx") {
              mimeType = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
              ext = "docx";
            }
      
            const dataUrl = format === "docx"
              ? tempCanvas.toDataURL("image/png") // Use PNG base64 in DOCX
              : tempCanvas.toDataURL(mimeType);
      
            const a = document.createElement("a");
            const downloadName = originalPdfFileName.replace(/\.pdf$/, `_signed.${ext}`);
            a.href = dataUrl;
            a.download = downloadName;
            a.click();
          } else {
            // PDF logic
            if (lastSignedBlob && lastSignedBlob.size > 0) {
              const url = URL.createObjectURL(lastSignedBlob);
              const a = document.createElement("a");
              a.href = url;
              a.download = originalPdfFileName;
              a.click();
              URL.revokeObjectURL(url);
            } else {
              alert("❗ Please click 'Save to APEX' first to generate the signed PDF.");
            }
          }
        });
      </script>
      </body>
      </html>

