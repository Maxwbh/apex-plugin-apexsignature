        let canvas = document.getElementById("pdf-canvas"),
            ctx = canvas.getContext("2d"),
            pdfDoc = null,
            pageNum = 1,
            uploadedPdfBuffer = null,
            lastSignedBlob = null,
            scale = 1.5,
            pdfViewport = null,
            signatureRelativePosition = { x: 0.05, y: 0.05 },
            originalPdfFileName = "signed_document.pdf";
      
        function renderPDF(fileBuffer) {
          pdfjsLib.getDocument({ data: fileBuffer }).promise.then(pdf => {
            pdfDoc = pdf;
            return pdf.getPage(pageNum);
          }).then(page => {
            pdfViewport = page.getViewport({ scale });
            canvas.width = pdfViewport.width;
            canvas.height = pdfViewport.height;
            page.render({ canvasContext: ctx, viewport: pdfViewport });
          });
        }
      
      //   const sigPad = document.getElementById("signature-pad");
      //   const sigCtx = sigPad.getContext("2d");
      //   let drawing = false;
      
      //   sigPad.addEventListener("mousedown", e => {
      //     drawing = true;
      //     sigCtx.beginPath();
      //     sigCtx.moveTo(e.offsetX, e.offsetY);
      //   });
      
      //   sigPad.addEventListener("mousemove", e => {
      //     if (drawing) {
      //       sigCtx.lineTo(e.offsetX, e.offsetY);
      //       sigCtx.stroke();
      //     }
      //   });
      
      //   sigPad.addEventListener("mouseup", () => drawing = false);
      //   sigPad.addEventListener("mouseleave", () => drawing = false);
      
        document.getElementById("clear-signature").addEventListener("click", () => {
          sigCtx.clearRect(0, 0, sigPad.width, sigPad.height);
        });
      
        document.getElementById("prev-btn").addEventListener("click", () => {
          document.getElementById("signature-preview").src = sigPad.toDataURL();
        });
      
        document.getElementById("upload-signature").addEventListener("change", function () {
          const reader = new FileReader();
          reader.onload = e => document.getElementById("signature-preview").src = e.target.result;
          reader.readAsDataURL(this.files[0]);
        });
      
        document.getElementById("save-sign").addEventListener("click", () => {
          alert("Signature saved. Now enable PDF preview and click 'Use This Sign'.");
        });
      
        document.getElementById("toggle-preview").addEventListener("change", function () {
          const show = this.checked;
          document.getElementById("pdf-container").style.display = show ? "block" : "none";
          document.getElementById("use-sign").style.display = show ? "inline-block" : "none";
          document.getElementById("upload-label").style.display = show ? "block" : "none";
          document.getElementById("upload-pdf").style.display = show ? "block" : "none";
        });
      
        document.getElementById("upload-pdf").addEventListener("change", function () {
          const file = this.files[0];
          if (!file || file.type !== "application/pdf") return alert("Please upload a PDF file.");
          const reader = new FileReader();
          reader.onload = function (e) {
            uploadedPdfBuffer = e.target.result;
            renderPDF(uploadedPdfBuffer);
      
            const uploadedFileName = file.name;
            const dotIndex = uploadedFileName.lastIndexOf(".");
            if (dotIndex > 0) {
              const base = uploadedFileName.substring(0, dotIndex);
              const ext = uploadedFileName.substring(dotIndex);
              originalPdfFileName = `${base}_signed${ext}`;
            } else {
              originalPdfFileName = `${uploadedFileName}_signed.pdf`;
            }
          };
          reader.readAsArrayBuffer(file);
        });
      
        document.getElementById("use-sign").addEventListener("click", () => {
          const sig = document.getElementById("draggable-signature");
          const preview = document.getElementById("signature-preview");
          if (!preview.src) return alert("No signature to use. Draw or upload first.");
          sig.src = preview.src;
          sig.style.display = "block";
          sig.style.left = `${canvas.offsetLeft + canvas.width * signatureRelativePosition.x}px`;
          sig.style.top = `${canvas.offsetTop + canvas.height * signatureRelativePosition.y}px`;
        });
      
        const signatureImg = document.getElementById("draggable-signature");
        let offsetX, offsetY, isDragging = false;
      
        signatureImg.addEventListener("mousedown", e => {
          isDragging = true;
          offsetX = e.offsetX;
          offsetY = e.offsetY;
        });
      
        document.addEventListener("mousemove", e => {
          if (isDragging) {
            const rect = canvas.getBoundingClientRect();
            const newX = e.clientX - rect.left - offsetX;
            const newY = e.clientY - rect.top - offsetY;
            const left = Math.max(0, Math.min(newX, canvas.width - signatureImg.width));
            const top = Math.max(0, Math.min(newY, canvas.height - signatureImg.height));
            signatureImg.style.left = `${left}px`;
            signatureImg.style.top = `${top}px`;
            signatureRelativePosition.x = left / canvas.width;
            signatureRelativePosition.y = top / canvas.height;
          }
        });
      
        document.addEventListener("mouseup", () => isDragging = false);
      
      
      
      
      
        async function generateSignedPDF() {
          if (!uploadedPdfBuffer || !pdfViewport) return alert("PDF not loaded.");
      
          const pdfDocLib = await PDFLib.PDFDocument.load(uploadedPdfBuffer);
          const page = pdfDocLib.getPages()[0];
          const { width: pdfWidth, height: pdfHeight } = page.getSize();
      
          const sigImg = document.getElementById("signature-preview");
          const sigCanvas = document.createElement("canvas");
          sigCanvas.width = sigImg.naturalWidth;
          sigCanvas.height = sigImg.naturalHeight;
          const sigCtx = sigCanvas.getContext("2d");
          sigCtx.drawImage(sigImg, 0, 0);
          const pngImage = await pdfDocLib.embedPng(sigCanvas.toDataURL());
      
          const canvasToPdfScaleX = pdfWidth / canvas.width;
          const canvasToPdfScaleY = pdfHeight / canvas.height;
          const offsetX = 10 * canvasToPdfScaleX;
          const offsetY = 20 * canvasToPdfScaleY;
      
          const x = signatureRelativePosition.x * pdfWidth + offsetX + 30;
          const y = pdfHeight - (signatureRelativePosition.y * pdfHeight) - 100 + offsetY;
      
          page.drawImage(pngImage, {
            x: x,
            y: y,
            width: 120,
            height: 50,
          });
      
          const pdfBytes = await pdfDocLib.save();
          const blob = new Blob([pdfBytes], { type: "application/pdf" });
          lastSignedBlob = blob;
      
          const reader = new FileReader();
          reader.onloadend = function () {
            const arrayBuffer = reader.result;
            const uint8Array = new Uint8Array(arrayBuffer);
            let binary = '';
            for (let i = 0; i < uint8Array.byteLength; i++) {
              binary += String.fromCharCode(uint8Array[i]);
            }
            const base64 = btoa(binary);
      
            if (apex.item("P1_SIGNED_FILENAME")) apex.item("P1_SIGNED_FILENAME").setValue(originalPdfFileName);
            if (apex.item("P1_SIGNED_BLOB")) apex.item("P1_SIGNED_BLOB").setValue(base64);
      
            apex.server.process("SAVE_SIGNED_PDF", {
              x01: originalPdfFileName,
              pageItems: "#P1_SIGNED_BLOB"
            }, {
              success: () => alert("✅ PDF saved to APEX."),
              error: err => {
                console.error(err);
                alert("❌ PDF save failed.");
              }
            });
          };
          reader.readAsArrayBuffer(blob);
        }
      
      document.getElementById("download-pdf").addEventListener("click", async () => {
        const format = document.getElementById("save-format")?.value || "pdf";
      
        if (format === "jpeg" || format === "png" || format === "docx") {
          const sig = document.getElementById("draggable-signature");
          if (!sig.src || sig.style.display === "none") {
            alert("❗ Please apply and position your signature before downloading.");
            return;
          }
      
          const tempCanvas = document.createElement("canvas");
          tempCanvas.width = canvas.width;
          tempCanvas.height = canvas.height;
          const tempCtx = tempCanvas.getContext("2d");
          tempCtx.drawImage(canvas, 0, 0);
          const left = parseFloat(sig.style.left);
          const top = parseFloat(sig.style.top);
          tempCtx.drawImage(sig, left, top, sig.width, sig.height);
      
          let mimeType = "image/jpeg";
          let ext = "jpg";
          if (format === "png") {
            mimeType = "image/png";
            ext = "png";
          } else if (format === "docx") {
            mimeType = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
            ext = "docx";
          }
      
          const dataUrl = format === "docx"
            ? tempCanvas.toDataURL("image/png") // Use PNG base64 in DOCX
            : tempCanvas.toDataURL(mimeType);
      
          const a = document.createElement("a");
          const downloadName = originalPdfFileName.replace(/\.pdf$/, `_signed.${ext}`);
          a.href = dataUrl;
          a.download = downloadName;
          a.click();
        } else {
          // PDF logic
          if (lastSignedBlob && lastSignedBlob.size > 0) {
            const url = URL.createObjectURL(lastSignedBlob);
            const a = document.createElement("a");
            a.href = url;
            a.download = originalPdfFileName;
            a.click();
            URL.revokeObjectURL(url);
          } else {
            alert("❗ Please click 'Save to APEX' first to generate the signed PDF.");
          }
        }
      });
      
      </script>
      
      
      
      
      </body>
