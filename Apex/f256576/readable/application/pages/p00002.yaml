            lastSignedBlob = null,
            scale = 1.5,
            pdfViewport = null,
            signatureRelativePosition = { x: 0.05, y: 0.05 };
      
        function renderPDF(fileBuffer) {
          pdfjsLib.getDocument({ data: fileBuffer }).promise.then(pdf => {
            pdfDoc = pdf;
            return pdf.getPage(pageNum);
          }).then(page => {
            pdfViewport = page.getViewport({ scale });
            canvas.width = pdfViewport.width;
            canvas.height = pdfViewport.height;
            page.render({ canvasContext: ctx, viewport: pdfViewport });
          });
        }
      
        const sigPad = document.getElementById("signature-pad");
        const sigCtx = sigPad.getContext("2d");
        let drawing = false;
      
        sigPad.onmousedown = e => { drawing = true; sigCtx.beginPath(); sigCtx.moveTo(e.offsetX, e.offsetY); };
        sigPad.onmousemove = e => { if (drawing) { sigCtx.lineTo(e.offsetX, e.offsetY); sigCtx.stroke(); } };
        sigPad.onmouseup = () => drawing = false;
        document.getElementById("clear-signature").onclick = () => sigCtx.clearRect(0, 0, sigPad.width, sigPad.height);
      
        document.getElementById("prev-btn").onclick = () => {
          document.getElementById("signature-preview").src = sigPad.toDataURL();
        };
      
        document.getElementById("upload-signature").addEventListener("change", function () {
          const reader = new FileReader();
          reader.onload = e => document.getElementById("signature-preview").src = e.target.result;
          reader.readAsDataURL(this.files[0]);
        });
      
        document.getElementById("save-sign").addEventListener("click", () => {
          alert("Signature saved. Now enable PDF preview and click 'Use This Sign'.");
        });
      
        document.getElementById("toggle-preview").addEventListener("change", function () {
          const show = this.checked;
          document.getElementById("pdf-container").style.display = show ? "block" : "none";
          document.getElementById("use-sign").style.display = show ? "inline-block" : "none";
          document.getElementById("upload-label").style.display = show ? "block" : "none";
          document.getElementById("upload-pdf").style.display = show ? "block" : "none";
        });
      
        document.getElementById("upload-pdf").addEventListener("change", function () {
          const file = this.files[0];
          if (!file || file.type !== "application/pdf") return alert("Please upload a PDF file.");
          const reader = new FileReader();
          reader.onload = function (e) {
            uploadedPdfBuffer = e.target.result;
            renderPDF(uploadedPdfBuffer);
          };
          reader.readAsArrayBuffer(file);
        });
      
        document.getElementById("use-sign").addEventListener("click", () => {
          const sig = document.getElementById("draggable-signature");
          const preview = document.getElementById("signature-preview");
          if (!preview.src) return alert("No signature to use. Draw or upload first.");
          sig.src = preview.src;
          sig.style.display = "block";
          sig.style.left = `${canvas.offsetLeft + canvas.width * signatureRelativePosition.x}px`;
          sig.style.top = `${canvas.offsetTop + canvas.height * signatureRelativePosition.y}px`;
        });
      
        const signatureImg = document.getElementById("draggable-signature");
        let offsetX, offsetY, isDragging = false;
      
        signatureImg.addEventListener("mousedown", e => {
          isDragging = true;
          offsetX = e.offsetX;
          offsetY = e.offsetY;
        });
      
        document.addEventListener("mousemove", e => {
          if (isDragging) {
            const rect = canvas.getBoundingClientRect();
            const newX = e.clientX - rect.left - offsetX;
            const newY = e.clientY - rect.top - offsetY;
            const left = Math.max(0, Math.min(newX, canvas.width - signatureImg.width));
            const top = Math.max(0, Math.min(newY, canvas.height - signatureImg.height));
            signatureImg.style.left = `${left}px`;
            signatureImg.style.top = `${top}px`;
            signatureRelativePosition.x = left / canvas.width;
            signatureRelativePosition.y = top / canvas.height;
          }
        });
      
