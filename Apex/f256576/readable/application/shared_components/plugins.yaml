---
# ====== Plugin: APEX Signature v3.8.0 ============================
# APEX Signature - Modern signature capture plugin for Oracle APEX
# Version: 3.8.0 - Updated for Oracle 23ai / APEX 24.2
# Author: Maxwell da Silva Oliveira (@maxwbh) - M&S do Brasil LTDA
# ================================================================

- # ====== Plugin: APEX Signature ====================================
  id: 79920272411927439
  identification:
    name: APEX Signature
    internal-name: DE.DANIELH.APEXSIGNATURE
    type: Region

  advanced:
    quick-pick: false

  subscription:
    version-number: 39535959170081

  source:
    plsql-code: |
      -- APEX Signature Region Plugin v3.8.0
      -- Render Function
      FUNCTION render_apexsignature (
          p_region              IN apex_plugin.t_region,
          p_plugin              IN apex_plugin.t_plugin,
          p_is_printer_friendly IN BOOLEAN)
          RETURN apex_plugin.t_region_render_result
      IS
          l_result              apex_plugin.t_region_render_result;
          l_region_id           VARCHAR2(100);
          l_canvas_id           VARCHAR2(100);
          l_canvas_width        NUMBER;
          l_canvas_height       NUMBER;
          l_line_width          NUMBER;
          l_pen_color           VARCHAR2(50);
          l_bg_color            VARCHAR2(50);
          l_capture_mode        VARCHAR2(50);
          l_show_toolbar        VARCHAR2(10);
          l_show_clear_btn      VARCHAR2(10);
          l_show_undo_btn       VARCHAR2(10);
          l_show_color_picker   VARCHAR2(10);
          l_show_thickness      VARCHAR2(10);
          l_enable_docsign      VARCHAR2(10);
          l_enable_templates    VARCHAR2(10);
          l_enable_timestamp    VARCHAR2(10);
          l_enable_initials     VARCHAR2(10);
          l_enable_verification VARCHAR2(10);
          l_enable_mobile       VARCHAR2(10);
          l_enable_export       VARCHAR2(10);
          l_js_code             VARCHAR2(32767);
      BEGIN
          -- Get region and canvas IDs
          l_region_id := apex_escape.html_attribute(p_region.static_id);
          IF l_region_id IS NULL THEN
              l_region_id := 'R' || p_region.id;
          END IF;
          l_canvas_id := l_region_id || '_canvas';

          -- Get plugin attributes (with defaults)
          l_canvas_width        := NVL(p_region.attribute_01, 400);
          l_canvas_height       := NVL(p_region.attribute_02, 200);
          l_line_width          := NVL(p_region.attribute_03, 2);
          l_pen_color           := NVL(p_region.attribute_04, '#000000');
          l_bg_color            := NVL(p_region.attribute_05, '#FFFFFF');
          l_capture_mode        := NVL(p_region.attribute_06, 'draw');
          l_show_toolbar        := NVL(p_region.attribute_07, 'Y');
          l_show_clear_btn      := NVL(p_region.attribute_08, 'Y');
          l_show_undo_btn       := NVL(p_region.attribute_09, 'Y');
          l_show_color_picker   := NVL(p_region.attribute_10, 'Y');
          l_show_thickness      := NVL(p_region.attribute_11, 'Y');
          l_enable_docsign      := NVL(p_region.attribute_12, 'N');
          l_enable_templates    := NVL(p_region.attribute_13, 'N');
          l_enable_timestamp    := NVL(p_region.attribute_14, 'N');
          l_enable_initials     := NVL(p_region.attribute_15, 'N');
          l_enable_verification := NVL(p_region.attribute_16, 'N');
          l_enable_mobile       := NVL(p_region.attribute_17, 'N');
          l_enable_export       := NVL(p_region.attribute_18, 'Y');

          -- Render signature container
          sys.htp.p('<div class="apex-sig-wrapper" id="' || l_region_id || '_wrapper">');

          -- Multi-Input Capture Tabs (Draw, Upload, Webcam)
          IF l_capture_mode IN ('all', 'tabs') THEN
              sys.htp.p('<div class="apex-sig-tabs">');
              sys.htp.p('  <button type="button" class="apex-sig-tab active" data-tab="draw">');
              sys.htp.p('    <span class="apex-sig-tab-icon">✏️</span> Draw');
              sys.htp.p('  </button>');
              sys.htp.p('  <button type="button" class="apex-sig-tab" data-tab="upload">');
              sys.htp.p('    <span class="apex-sig-tab-icon">📁</span> Upload');
              sys.htp.p('  </button>');
              sys.htp.p('  <button type="button" class="apex-sig-tab" data-tab="webcam">');
              sys.htp.p('    <span class="apex-sig-tab-icon">📷</span> Webcam');
              sys.htp.p('  </button>');
              sys.htp.p('</div>');
          END IF;

          -- Canvas container
          sys.htp.p('<div class="apex-sig-canvas-container" id="' || l_region_id || '_container">');
          sys.htp.p('  <canvas id="' || l_canvas_id || '" ');
          sys.htp.p('          width="' || l_canvas_width || '" ');
          sys.htp.p('          height="' || l_canvas_height || '" ');
          sys.htp.p('          style="background-color:' || l_bg_color || ';">');
          sys.htp.p('  </canvas>');
          sys.htp.p('</div>');

          -- Toolbar (if enabled)
          IF l_show_toolbar = 'Y' THEN
              sys.htp.p('<div class="apex-sig-toolbar" id="' || l_region_id || '_toolbar">');

              IF l_show_clear_btn = 'Y' THEN
                  sys.htp.p('  <button type="button" class="apex-sig-btn apex-sig-btn-clear" title="Clear">');
                  sys.htp.p('    <span class="apex-sig-btn-icon">🗑️</span> Clear');
                  sys.htp.p('  </button>');
              END IF;

              IF l_show_undo_btn = 'Y' THEN
                  sys.htp.p('  <button type="button" class="apex-sig-btn apex-sig-btn-undo" title="Undo">');
                  sys.htp.p('    <span class="apex-sig-btn-icon">↩️</span> Undo');
                  sys.htp.p('  </button>');
              END IF;

              IF l_show_color_picker = 'Y' THEN
                  sys.htp.p('  <div class="apex-sig-color-control">');
                  sys.htp.p('    <label>Color:</label>');
                  sys.htp.p('    <input type="color" class="apex-sig-color-picker" value="' || l_pen_color || '">');
                  sys.htp.p('  </div>');
              END IF;

              IF l_show_thickness = 'Y' THEN
                  sys.htp.p('  <div class="apex-sig-thickness-control">');
                  sys.htp.p('    <label>Size:</label>');
                  sys.htp.p('    <input type="range" class="apex-sig-thickness-slider" min="1" max="10" value="' || l_line_width || '">');
                  sys.htp.p('    <span class="apex-sig-thickness-value">' || l_line_width || 'px</span>');
                  sys.htp.p('  </div>');
              END IF;

              sys.htp.p('</div>');
          END IF;

          sys.htp.p('</div>'); -- Close wrapper

          -- Initialize JavaScript
          l_js_code := 'apex.jQuery(function() {' || CHR(10) ||
                       '  apexSignature.init("' || l_region_id || '", {' || CHR(10) ||
                       '    canvasId: "' || l_canvas_id || '",' || CHR(10) ||
                       '    width: ' || l_canvas_width || ',' || CHR(10) ||
                       '    height: ' || l_canvas_height || ',' || CHR(10) ||
                       '    lineWidth: ' || l_line_width || ',' || CHR(10) ||
                       '    penColor: "' || l_pen_color || '",' || CHR(10) ||
                       '    backgroundColor: "' || l_bg_color || '",' || CHR(10) ||
                       '    captureMode: "' || l_capture_mode || '",' || CHR(10) ||
                       '    showToolbar: ' || CASE WHEN l_show_toolbar = 'Y' THEN 'true' ELSE 'false' END || ',' || CHR(10) ||
                       '    enableDocSign: ' || CASE WHEN l_enable_docsign = 'Y' THEN 'true' ELSE 'false' END || ',' || CHR(10) ||
                       '    enableTemplates: ' || CASE WHEN l_enable_templates = 'Y' THEN 'true' ELSE 'false' END || ',' || CHR(10) ||
                       '    enableTimestamp: ' || CASE WHEN l_enable_timestamp = 'Y' THEN 'true' ELSE 'false' END || ',' || CHR(10) ||
                       '    enableInitials: ' || CASE WHEN l_enable_initials = 'Y' THEN 'true' ELSE 'false' END || ',' || CHR(10) ||
                       '    enableVerification: ' || CASE WHEN l_enable_verification = 'Y' THEN 'true' ELSE 'false' END || ',' || CHR(10) ||
                       '    enableMobile: ' || CASE WHEN l_enable_mobile = 'Y' THEN 'true' ELSE 'false' END || ',' || CHR(10) ||
                       '    enableExport: ' || CASE WHEN l_enable_export = 'Y' THEN 'true' ELSE 'false' END || CHR(10) ||
                       '  });' || CHR(10) ||
                       '});';

          apex_javascript.add_onload_code(p_code => l_js_code);

          RETURN l_result;
      END render_apexsignature;

  callbacks:
    render-function-name: render_apexsignature

  custom-attributes:
    substitute-attribute-values: true

